name: Run SYNA U-Boot image flash

on:
  workflow_dispatch:
  push:
    branches: [ wip/ci_cd_test ]
    paths:
      - '.github/workflows/test-burn.yml'

permissions:
  contents: read

jobs:
  syna-uboot-flash:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.COMPILER_DEV_TOKEN }}
      REPO: synaptics-torq/torq-compiler-dev
      WORKFLOW: test-image-burn.yml
      REF: wip/burn_image
    steps:
      - name: Trigger burn workflow in torq-compiler-dev
        env:
          IMAGE_URL: ${{ vars.IMAGE_URL }}
        run: |
          set -eu
          START="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run "$WORKFLOW" -R "$REPO" --ref "$REF" -f image_url="$IMAGE_URL"
          echo "START=$START" >> "$GITHUB_ENV"

      - name: Wait for burn workflow to finish
        run: |
          set -eu
          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID="$(gh run list -R "$REPO" --workflow "$WORKFLOW" --branch "$REF" \
              --event workflow_dispatch --created ">=$START" --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$RUN_ID" ] && break
            sleep 10
          done
          if [ -z "$RUN_ID" ]; then
            echo "Triggered run not found in $REPO" >&2
            exit 1
          fi
          echo "Watching $REPO run $RUN_ID"
          gh run watch "$RUN_ID" -R "$REPO" --exit-status --interval 30
