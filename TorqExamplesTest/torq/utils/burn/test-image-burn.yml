name: Run SYNA U-Boot image flash

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: Build version used to build TFTPPATH; defaults to scripts/astra_build_version.txt when omitted
        required: false
        default: ''
        type: string
      profile:
        description: Profile name used to build TFTPPATH; defaults to sl2619_oobe_scarthgap when omitted
        required: false
        default: ''
        type: string
      image_url:
        description: Optional firmware image URL to download into the local TFTP directory before flashing
        required: false
        default: ''
        type: string
  push:
    paths:
      - 'python/torq/utils/burn/**'
      - '.github/workflows/test-image-burn.yml'

permissions:
  contents: read

concurrency:
  group: syna-uboot-burn-astra-sh
  cancel-in-progress: false

jobs:
  syna-uboot-flash:
    runs-on: astra-machina-sl-sh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Create Python virtual environment
        working-directory: python/torq/utils/burn
        run: python -m venv .venv

      - name: Install device_toolkit dependencies
        working-directory: python/torq/utils/burn
        run: |
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install 'pyserial>=3.0.0' pytest

      - name: Run SYNA U-Boot image flash
        working-directory: python/torq/utils/burn
        env:
          BUILD_VERSION: ${{ inputs.build_version }}
          PROFILE: ${{ inputs.profile != '' && inputs.profile || 'sl2619_oobe_scarthgap' }}
          IMAGE_URL: ${{ inputs.image_url || 'http://iotmmswfileserver.synaptics.com:8000/magnolia/202610/20261024/202610242301/LinuxSDK-Serpens/sl2619_oobe_scarthgap/Eng_Build' }}
          # TODO: internal URL, move to a repo/org variable before open-sourcing
          IMAGE_BASE_URL: http://iotmmswfileserver.synaptics.com:8000/magnolia
        run: |
          set -eu
          . .venv/bin/activate
          CONFIG_PATH="${CONFIG_PATH:-$HOME/cases/env_config.ini}"
          test -f "$CONFIG_PATH"
          if [ -z "${BUILD_VERSION:-}" ] && [ -n "${GITHUB_WORKSPACE:-}" ]; then
            BUILD_VERSION="$(cat "$GITHUB_WORKSPACE/scripts/astra_build_version.txt")"
          fi
          if [ -z "${IMAGE_URL:-}" ] && { [ -z "${BUILD_VERSION:-}" ] || [ -z "${PROFILE:-}" ]; }; then
            echo "Missing environment variables: BUILD_VERSION and PROFILE are required when IMAGE_URL is not set" >&2
            exit 1
          fi
          export BUILD_VERSION="${BUILD_VERSION:-}" PROFILE="${PROFILE:-}"
          COMMAND=(case_runner.py --config "$CONFIG_PATH")
          set -o pipefail
          python "${COMMAND[@]}" 2>&1 | tee upgrade-syna-image.log

      - name: Upload SYNA U-Boot artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: syna-uboot-burn-${{ github.run_id }}
          path: |
            python/torq/utils/burn/platforminfo.json
          if-no-files-found: warn

      - name: Upload SYNA U-Boot diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: syna-uboot-burn-diagnostics-${{ github.run_id }}
          path: |
            python/torq/utils/burn/log/**
            python/torq/utils/burn/upgrade-syna.*.log
          if-no-files-found: warn
